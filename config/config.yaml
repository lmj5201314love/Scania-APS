project:
  name: scania_aps_predictive_maintenance
  stage: day12_structural_feature_design

paths:
  train_raw: data/raw/aps_failure_training_set.csv
  test_raw: data/raw/aps_failure_test_set.csv
  structural_features_config_path: config/structural_features.yaml
  interim_dir: data/interim
  processed_dir: data/processed
  figures_dir: outputs/figures
  metrics_dir: outputs/metrics
  predictions_dir: outputs/predictions
  tables_dir: outputs/tables
  reports_dir: reports

data:
  label_column: class
  missing_value_token: na
  positive_label: pos
  negative_label: neg
  target_mapping:
    pos: 1
    neg: 0

business_cost:
  false_positive: 10
  false_negative: 500

evaluation:
  primary_metrics:
    - precision
    - recall
    - f1
    - f2
    - pr_auc
    - total_cost

model:
  random_state: 42
  default_threshold: 0.5
  high_missing_threshold: 0.8

validation:
  valid_size: 0.2
  stratify: true

feature_ablation:
  missing_thresholds:
    drop_50: 0.50
    drop_80: 0.80

  variance_threshold: 0.0
  correlation_threshold: 0.95

  enable_strategies:
    - median_all
    - drop_80_missing_median
    - drop_50_missing_median
    - median_with_indicator
    - xgb_native_missing
    - low_variance_filter
    - high_correlation_filter
    - l1_feature_selection
    - missing_indicator_only

advanced_models:
  random_forest:
    n_estimators: 200
    max_depth: null
    min_samples_leaf: 1
    class_weight: balanced
    n_jobs: -1

  xgboost:
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: logloss
    n_jobs: -1
