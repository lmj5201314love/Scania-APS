project:
  name: scania_aps_predictive_maintenance
  stage: validation_based_model_selection

paths:
  train_raw: data/raw/aps_failure_training_set.csv
  test_raw: data/raw/aps_failure_test_set.csv
  interim_dir: data/interim
  processed_dir: data/processed
  figures_dir: outputs/figures
  metrics_dir: outputs/metrics
  predictions_dir: outputs/predictions
  tables_dir: outputs/tables
  reports_dir: reports

data:
  label_column: class
  missing_value_token: na
  positive_label: pos
  negative_label: neg
  target_mapping:
    pos: 1
    neg: 0

business_cost:
  false_positive: 10
  false_negative: 500

evaluation:
  primary_metrics:
    - precision
    - recall
    - f1
    - f2
    - pr_auc
    - total_cost

model:
  random_state: 42
  default_threshold: 0.5
  high_missing_threshold: 0.8

validation:
  valid_size: 0.2
  stratify: true

advanced_models:
  random_forest:
    n_estimators: 200
    max_depth: null
    min_samples_leaf: 1
    class_weight: balanced
    n_jobs: -1

  xgboost:
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: logloss
    n_jobs: -1
