project:
  name: scania_aps_predictive_maintenance
  stage: day18_oof_probability_ensemble

paths:
  train_raw: data/raw/aps_failure_training_set.csv
  test_raw: data/raw/aps_failure_test_set.csv
  structural_features_config_path: config/structural_features.yaml
  interim_dir: data/interim
  processed_dir: data/processed
  figures_dir: outputs/figures
  metrics_dir: outputs/metrics
  predictions_dir: outputs/predictions
  tables_dir: outputs/tables
  reports_dir: reports

data:
  label_column: class
  missing_value_token: na
  positive_label: pos
  negative_label: neg
  target_mapping:
    pos: 1
    neg: 0

business_cost:
  false_positive: 10
  false_negative: 500

evaluation:
  primary_metrics:
    - precision
    - recall
    - f1
    - f2
    - pr_auc
    - total_cost

model:
  random_state: 42
  default_threshold: 0.5
  high_missing_threshold: 0.8

validation:
  valid_size: 0.2
  stratify: true

feature_ablation:
  missing_thresholds:
    drop_50: 0.50
    drop_80: 0.80

  variance_threshold: 0.0
  correlation_threshold: 0.95

  enable_strategies:
    - median_all
    - drop_80_missing_median
    - drop_50_missing_median
    - median_with_indicator
    - xgb_native_missing
    - low_variance_filter
    - high_correlation_filter
    - l1_feature_selection
    - missing_indicator_only

advanced_models:
  random_forest:
    n_estimators: 200
    max_depth: null
    min_samples_leaf: 1
    class_weight: balanced
    n_jobs: -1

  xgboost:
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: logloss
    n_jobs: -1

xgb_tuning:
  random_state: 42
  tuning_mode: two_stage_random_search

  broad_trials_per_strategy: 100
  refine_trials_per_strategy: 50

  max_runtime_control:
    allow_auto_reduce_trials: true
    min_broad_trials_per_strategy: 80
    min_refine_trials_per_strategy: 30

  threshold_grid:
    start: 0.01
    stop: 0.99
    step: 0.01

  candidate_strategies:
    - baseline_median_all
    - median_all_structural_all
    - drop_high_missing_median

  search_space_broad:
    n_estimators:
      min: 300
      max: 2500
    learning_rate:
      min: 0.005
      max: 0.20
      distribution: log_uniform
    max_depth:
      values: [2, 3, 4, 5, 6, 7, 8, 9, 10]
    min_child_weight:
      min: 1
      max: 60
      distribution: log_uniform
    subsample:
      min: 0.45
      max: 1.0
    colsample_bytree:
      min: 0.35
      max: 1.0
    gamma:
      min: 0
      max: 20
    reg_lambda:
      min: 0.1
      max: 80
      distribution: log_uniform
    reg_alpha:
      min: 0
      max: 30
    scale_pos_weight:
      min: 10
      max: 180
    max_delta_step:
      values: [0, 1, 2, 3, 4, 5, 6, 8, 10]

  xgb_fixed_params:
    objective: binary:logistic
    eval_metric: aucpr
    tree_method: hist
    n_jobs: -1

  ranking_rule:
    primary: total_cost
    tie_breakers:
      - fn
      - recall
      - f2
      - average_precision

oof_threshold:
  stage: day17_oof_recall_floor_bin_projection
  random_state: 42

  cv:
    n_splits: 5
    n_repeats: 2
    stratified: true
    shuffle: true

  allow_runtime_downgrade:
    enabled: true
    min_n_splits: 5
    min_n_repeats: 1

  threshold_grid:
    start: 0.01
    stop: 0.99
    step: 0.01

  threshold_selection_rules:
    - cost_min
    - recall_floor_975
    - recall_floor_980
    - fn_floor_20
    - fn_floor_25

  recall_floors:
    recall_floor_975: 0.975
    recall_floor_980: 0.980

  fn_floors:
    fn_floor_20: 20
    fn_floor_25: 25

  candidate_strategies:
    - baseline_median_all
    - median_all_structural_all
    - median_all_bin_projection
    - median_all_structural_all_plus_bin_projection

  model:
    name: xgboost
    use_day14_like_params: true
    objective: binary:logistic
    eval_metric: aucpr
    tree_method: hist
    n_jobs: -1

  bin_projection:
    enabled: true
    candidate_prefix_groups:
      - ag
      - ay
      - az
      - ba
      - cn
      - cs
      - ee
    add_features:
      - sum
      - mean
      - std
      - max
      - nonzero_count
      - zero_rate
      - weighted_mean_bin
      - tail_ratio
      - peak_bin_index
    tail_bin_count: 3
    keep_original_bin_columns: true

oof_ensemble:
  stage: day18_oof_probability_ensemble
  random_state: 42

  cv:
    n_splits: 5
    n_repeats: 1
    stratified: true
    shuffle: true

  base_candidate_strategies:
    - median_all_structural_all
    - median_with_selected_missing_indicators
    - median_all_prefix_zero_rate

  threshold_grid:
    start: 0.01
    stop: 0.99
    step: 0.01

  threshold_selection_rules:
    - cost_min
    - recall_floor_960
    - recall_floor_965
    - recall_floor_970
    - fn_floor_35
    - fn_floor_40
    - fn_floor_45

  recall_floors:
    recall_floor_960: 0.960
    recall_floor_965: 0.965
    recall_floor_970: 0.970

  fn_floors:
    fn_floor_35: 35
    fn_floor_40: 40
    fn_floor_45: 45

  ensemble_recipes:
    main:
      - structural_all_single
      - weighted_70_30_indicator
      - weighted_80_20_indicator
      - weighted_60_25_15
      - weighted_70_20_10
      - weighted_rank_60_25_15

    auxiliary:
      - mean_structural_indicator
      - weighted_80_20_prefixzero
      - rank_average_three
      - mean_three_models

    diagnostic:
      - mean_structural_prefixzero
      - max_three_models

  official_test_candidate_filter:
    min_oof_cost_reduction_pct: 0.03
    min_fn_reduction: 3
    max_fp_increase_per_fn_saved: 40
    allow_max_three_models: false
    allow_diagnostic_as_final_candidate: false
