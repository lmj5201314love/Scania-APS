project:
  name: scania_aps_predictive_maintenance
  stage: day16_tuned_xgb_official_test_evaluation

paths:
  train_raw: data/raw/aps_failure_training_set.csv
  test_raw: data/raw/aps_failure_test_set.csv
  structural_features_config_path: config/structural_features.yaml
  interim_dir: data/interim
  processed_dir: data/processed
  figures_dir: outputs/figures
  metrics_dir: outputs/metrics
  predictions_dir: outputs/predictions
  tables_dir: outputs/tables
  reports_dir: reports

data:
  label_column: class
  missing_value_token: na
  positive_label: pos
  negative_label: neg
  target_mapping:
    pos: 1
    neg: 0

business_cost:
  false_positive: 10
  false_negative: 500

evaluation:
  primary_metrics:
    - precision
    - recall
    - f1
    - f2
    - pr_auc
    - total_cost

model:
  random_state: 42
  default_threshold: 0.5
  high_missing_threshold: 0.8

validation:
  valid_size: 0.2
  stratify: true

feature_ablation:
  missing_thresholds:
    drop_50: 0.50
    drop_80: 0.80

  variance_threshold: 0.0
  correlation_threshold: 0.95

  enable_strategies:
    - median_all
    - drop_80_missing_median
    - drop_50_missing_median
    - median_with_indicator
    - xgb_native_missing
    - low_variance_filter
    - high_correlation_filter
    - l1_feature_selection
    - missing_indicator_only

advanced_models:
  random_forest:
    n_estimators: 200
    max_depth: null
    min_samples_leaf: 1
    class_weight: balanced
    n_jobs: -1

  xgboost:
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: logloss
    n_jobs: -1

xgb_tuning:
  random_state: 42
  tuning_mode: two_stage_random_search

  broad_trials_per_strategy: 100
  refine_trials_per_strategy: 50

  max_runtime_control:
    allow_auto_reduce_trials: true
    min_broad_trials_per_strategy: 80
    min_refine_trials_per_strategy: 30

  threshold_grid:
    start: 0.01
    stop: 0.99
    step: 0.01

  candidate_strategies:
    - baseline_median_all
    - median_all_structural_all
    - drop_high_missing_median

  search_space_broad:
    n_estimators:
      min: 300
      max: 2500
    learning_rate:
      min: 0.005
      max: 0.20
      distribution: log_uniform
    max_depth:
      values: [2, 3, 4, 5, 6, 7, 8, 9, 10]
    min_child_weight:
      min: 1
      max: 60
      distribution: log_uniform
    subsample:
      min: 0.45
      max: 1.0
    colsample_bytree:
      min: 0.35
      max: 1.0
    gamma:
      min: 0
      max: 20
    reg_lambda:
      min: 0.1
      max: 80
      distribution: log_uniform
    reg_alpha:
      min: 0
      max: 30
    scale_pos_weight:
      min: 10
      max: 180
    max_delta_step:
      values: [0, 1, 2, 3, 4, 5, 6, 8, 10]

  xgb_fixed_params:
    objective: binary:logistic
    eval_metric: aucpr
    tree_method: hist
    n_jobs: -1

  ranking_rule:
    primary: total_cost
    tie_breakers:
      - fn
      - recall
      - f2
      - average_precision
